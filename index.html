<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#93d8ff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小孟--翻牌挑战" />
    <meta name="description" content="免登录、无广告、手机优先的纯静态叠牌三消小游戏。" />
    <title>小孟--翻牌挑战 V520.13.14</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="status-bar" aria-label="游戏状态">
        <div class="status-card lives-card">
          <span class="status-icon" aria-hidden="true">❤</span>
          <strong id="livesText">5</strong>
        </div>

        <div class="level-card">
          <div class="level-title" id="levelTitle">第 1 关</div>
          <div class="version-badge">V520.13.14</div>
          <div class="star-row" id="starRow" aria-label="星级进度"></div>
          <div class="progress-track" aria-hidden="true">
            <span id="progressFill"></span>
          </div>
        </div>

        <div class="status-card coin-card">
          <span class="status-icon coin" aria-hidden="true">●</span>
          <strong id="coinText">0</strong>
          <button id="helpBtn" class="round-btn help-round" type="button" aria-label="玩法说明">?</button>
          <button id="settingsBtn" class="round-btn settings-round" type="button" aria-label="设置">⚙</button>
        </div>
      </header>

      <main class="playfield">
        <section class="board-stage" aria-label="主牌区">
          <div id="levelStrip" class="level-strip" aria-label="关卡选择"></div>
          <div id="board" class="board" aria-label="叠牌牌堆"></div>
          <div id="floatLayer" class="float-layer" aria-live="polite"></div>
        </section>

        <section class="reserve-area" aria-label="备用牌堆">
          <div id="reservePiles" class="reserve-piles"></div>
        </section>

        <section class="slot-area" aria-label="卡槽区">
          <div class="slot-title">
            <span id="slotCountText">卡槽 0 / 7</span>
            <span id="riskText">稳住节奏</span>
          </div>
          <div id="slots" class="slots"></div>
        </section>
      </main>

      <footer class="tool-bar" aria-label="道具栏">
        <button id="hintBtn" class="tool-btn" type="button">
          <span class="tool-icon" aria-hidden="true">💡</span>
          <span>提示</span>
          <b id="hintCount">0</b>
        </button>
        <button id="undoBtn" class="tool-btn" type="button">
          <span class="tool-icon" aria-hidden="true">↶</span>
          <span>撤回</span>
          <b id="undoCount">0</b>
        </button>
        <button id="shuffleBtn" class="tool-btn" type="button">
          <span class="tool-icon" aria-hidden="true">🔀</span>
          <span>洗牌</span>
          <b id="shuffleCount">0</b>
        </button>
        <button id="expandBtn" class="tool-btn wide" type="button">
          <span class="tool-icon" aria-hidden="true">▶</span>
          <span>加 3 格</span>
          <b id="expandCount">0</b>
        </button>
      </footer>
    </div>

    <dialog id="gameDialog" class="game-dialog">
      <div class="dialog-card">
        <h2 id="dialogTitle">小孟--翻牌挑战</h2>
        <p id="dialogText">点开没有被压住的牌，任意三张相同会自动消除。底部卡槽满了才会失败。</p>
        <div class="dialog-actions">
          <button id="resetProgressBtn" class="secondary-btn" type="button">重置进度</button>
          <button id="dialogPrimaryBtn" type="button">开始</button>
        </div>
      </div>
    </dialog>

    <script src="./game.js" defer></script>
  </body>
</html>
